version: '3.8'

services:
  fedmed-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  fl-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fl_server
    ports:
      - "8080:8080"
    environment:
      - FL_ROUNDS=20
    restart: always

  hospital-node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hospital_node
    environment:
      - HOSPITAL_ID=johns_hopkins
      - FL_SERVER_ADDR=fl-server:8080
    depends_on:
      - fl-server

  hospital-node-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hospital_node
    environment:
      - HOSPITAL_ID=mayo_clinic
      - FL_SERVER_ADDR=fl-server:8080
    depends_on:
      - fl-server
